$("#hcal").onclick=e=>{const b=e.target.closest(".hd[data-k]");if(!b||b.disabled)return;hsel=hsel===b.dataset.k?"":b.dataset.k;hrender()};
$("#hpv").onclick=()=>{hm=new Date(hm.getFullYear(),hm.getMonth()-1,1);hrender()};
$("#hnx").onclick=()=>{hm=new Date(hm.getFullYear(),hm.getMonth()+1,1);hrender()};
hrender();
// ===== 開発用データ閲覧 =====
async function loadEvents(){if(DB){try{const q=await DB.collection("events").limit(5000).get();return{src:"共有データ（全ユーザー）",ev:q.docs.map(d=>d.data())}}catch(e){}}
  let l=[];try{l=JSON.parse(localStorage.getItem("yt-log")||"[]")}catch(e){}return{src:"この端末のみ（共有データは未接続）",ev:l}}
function statsHTML(r){
  const ev=r.ev.filter(e=>!e.dev),n=t=>ev.filter(e=>e.type===t).length,dr=ev.filter(e=>e.type==="draw");
  const row=(a,b)=>'<tr><td>'+a+'</td><td>'+b+'</td></tr>',bc={};dr.forEach(e=>bc[e.card]=(bc[e.card]||0)+1);
  const days={};dr.forEach(e=>days[e.day]=(days[e.day]||0)+1);
  const rec=Object.keys(days).sort().slice(-7).map(k=>row(k,days[k]+"回")).join("")||row("なし","");
  const cards=Object.keys(bc).sort((a,b)=>bc[b]-bc[a]).map(k=>{const c=CARDS.find(x=>x.id===k);return row(c?esc(c.name):esc(k),bc[k]+"回")}).join("")||row("なし","");
  return '<h3>データ閲覧（開発用）</h3><p style="margin:0 0 8px;color:var(--mute)">'+esc(r.src)+'</p><table>'
  +row("訪問",n("visit")+"回")+row("ユニーク訪問者",new Set(ev.map(e=>e.uid)).size+"人")+row("カードを引いた回数",dr.length+"回")
  +row("　うち「運命を変える」",dr.filter(e=>e.fate).length+"回")+row("　うち影のカード",dr.filter(e=>e.omen).length+"回")
  +row("　うち稀なる星（★5）",dr.filter(e=>!e.omen&&e.rarity===5).length+"回")+row("　うち輝く星（★4）",dr.filter(e=>!e.omen&&e.rarity===4).length+"回")+row("　うち静かな星（★3）",dr.filter(e=>!e.omen&&e.rarity===3).length+"回")
  +row("noteへ：カード詳細",n("note_card")+"回")+row("noteへ：影の対策",n("note_omen")+"回")+row("noteへ：関連note",n("note_related")+"回")+row("noteへ：記事一覧",n("note_list")+"回")
  +row("メニュー操作",n("menu")+"回")+'</table><h3 style="margin-top:14px">カード別</h3><table>'+cards+'</table><h3 style="margin-top:14px">直近7日（抽選）</h3><table>'+rec+'</table>'
  +'<div class="actions"><button class="btn ghost" id="dvre">再読み込み</button></div>'}
async function showStats(){openModal("<h3>読み込み中…</h3>");const r=await loadEvents();openModal(statsHTML(r));$("#dvre").onclick=showStats}
$("#gimg").src=IMG.main;$("#chibi").src=IMG.chibi;
if(DEV){const dv=$("#dev"),sel=$("#dvs");sel.innerHTML=CARDS.map(c=>'<option value="'+c.id+'">'+(c.omen?"☾影 ":"★".repeat(c.rarity)+" ")+esc(c.name)+'（'+esc(c.cats[0])+'）</option>').join("");
  let tp=0,tt=0;const tap=()=>{const t=Date.now();tp=t-tt<2500?tp+1:1;tt=t;if(tp>=5){tp=0;dv.hidden=false}};
  document.querySelector("h1").addEventListener("click",tap);document.querySelector(".zk h2").addEventListener("click",tap);
  $("#dvc").onclick=()=>{dv.hidden=true};
  $("#dvr").onclick=()=>{store.set({...store.get(),date:null});FORCE=null;setup();window.scrollTo(0,0);dv.hidden=true};
  $("#dvd").onclick=showStats;
  $("#dvg").onclick=()=>{FORCE=sel.value;store.set({...store.get(),date:null});setup();window.scrollTo(0,0);dv.hidden=true;toast("指定カードをセットしました。カードを選んでください")}}
const s=store.get(),saved=s.date===today()&&CARDS.find(c=>c.id===s.id);
saved?show(saved,false):setup();
</script></body></html>
